<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>IMPI FloorPlan Studio – Staff sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f4;--pn:#fff;--ink:#12202b;--mut:#5b6b78;--ln:#d6dde2;--ac:#e8590c;--rd:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a22;--pn:#16242e;--ink:#e8eef2;--mut:#96a7b4;--ln:#2a3b47}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(400px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:24px;box-shadow:0 8px 28px rgba(10,30,45,.18)}
.logo{display:block;max-height:64px;max-width:100%;margin:0 auto 10px}
h1{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:26px;margin:0 0 2px;text-align:center}
p{margin:0 0 16px;color:var(--mut);font-size:14px;text-align:center}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:12px}
input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:11px;min-height:44px}
input:focus-visible,button:focus-visible{outline:2px solid #1c6bb0;outline-offset:1px}
button{width:100%;font:inherit;font-weight:600;min-height:46px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer;margin-top:4px}
button[disabled]{opacity:.6;cursor:wait}
#err{color:var(--rd);font-size:14px;min-height:20px;margin:6px 0 0;text-align:center}
small{display:block;margin-top:14px;text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
 <img class="logo" id="lg" alt="IMPI Protection Agency" src="/impi-logo.png" hidden onload="this.hidden=false">
 <h1>IMPI FloorPlan Studio</h1>
 <p id="sub">Staff sign in</p>
 <label id="nameRow" hidden>Your name<input id="name" autocomplete="name"></label>
 <label>Email<input id="email" type="email" autocomplete="username" required></label>
 <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
 <button id="go" type="submit">Sign in</button>
 <div id="err" role="alert"></div>
 <small>Authorised IMPI staff only.</small>
</form>
<script>
(function(){
var setup=false,$=function(i){return document.getElementById(i)};
fetch('/api/auth',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){
 if(j.user){location.replace('/app');return}
 if(j.needsSetup){setup=true;$('sub').textContent='First run: create the administrator account';$('nameRow').hidden=false;$('go').textContent='Create admin account';$('pw').autocomplete='new-password';$('pw').placeholder='At least 10 characters'}
}).catch(function(){$('err').textContent='Cannot reach the server. Check your connection.'});
$('f').onsubmit=function(e){
 e.preventDefault();$('err').textContent='';$('go').disabled=true;
 var b=setup?{action:'setup',name:$('name').value,email:$('email').value,password:$('pw').value}:{action:'login',email:$('email').value,password:$('pw').value};
 fetch('/api/auth',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(b)})
  .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
  .then(function(x){if(x.ok&&x.j.user){location.replace('/app')}else{$('err').textContent=(x.j&&x.j.error)||'Sign in failed';$('go').disabled=false}})
  .catch(function(){$('err').textContent='Cannot reach the server. Try again.';$('go').disabled=false});
};
})();
</script>
</body>
</html>
