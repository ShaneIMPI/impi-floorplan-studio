<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FloorPlan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f1f4f4;--pn:#ffffff;--pn2:#f6f8f8;--ink:#12202b;--mut:#5b6b78;--ln:#d6dde2;--ac:#e8590c;--ac-ink:#ffffff;--bl:#1c6bb0;--gr:#12804a;--rd:#c62828;--sh:0 8px 28px rgba(10,30,45,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a22;--pn:#16242e;--pn2:#1b2b36;--ink:#e8eef2;--mut:#96a7b4;--ln:#2a3b47}}
:root[data-theme="dark"]{--bg:#0e1a22;--pn:#16242e;--pn2:#1b2b36;--ink:#e8eef2;--mut:#96a7b4;--ln:#2a3b47}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
#saveChip{font-size:12px;padding:4px 10px;border-radius:12px;border:1px solid var(--ln);color:var(--mut);background:var(--pn);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;cursor:default}
#saveChip.ok{border-color:#2e7d32;color:#2e7d32}
#saveChip.warn{border-color:#e8590c;color:#c2410c;font-weight:600}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:19px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:12px;color:var(--mut)}
.hs{flex:1}
.btn{border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font-weight:600}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn.dng{color:var(--rd)}
.btn:focus-visible,.tool:focus-visible,.pal:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
#tools{display:flex;gap:4px;padding:6px 8px;background:var(--pn);border-bottom:1px solid var(--ln);overflow-x:auto;scrollbar-width:none;align-items:center}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid transparent;background:none;border-radius:8px;padding:4px 9px;min-width:56px;cursor:pointer;font-size:12px;color:var(--mut)}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tool:hover:not(.on){background:var(--pn2);color:var(--ink)}
.sep{width:1px;height:30px;background:var(--ln);margin:0 4px;flex:0 0 auto}
#snapSel,#lineSel{flex:0 0 auto;border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:6px 6px;min-height:36px}
#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;position:relative;background:#e9edec}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;background:rgba(18,32,43,.92);color:#fff;border-radius:20px;padding:6px 14px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .15s;text-align:center}
#hint.on{opacity:1}
#status{position:absolute;left:8px;bottom:8px;font-size:12px;color:#33444f;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;pointer-events:none;font-variant-numeric:tabular-nums}
#selbar{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:none;gap:6px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px;box-shadow:var(--sh)}
#selbar.on{display:flex}
#viewSel{flex:0 0 auto;border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:6px 6px;min-height:36px;max-width:190px;font-weight:600}
#lineSel{display:none}#lineSel.on{display:block}
#layBar{position:absolute;left:12px;top:12px;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pn);border:2px solid #1c6bb0;border-radius:10px;padding:6px 10px;z-index:5;max-width:calc(100% - 24px)}
#layBar.on{display:flex}
#layBar b{color:#1c6bb0;font-size:13px}
#evBar{position:absolute;left:12px;top:12px;display:none;gap:8px;align-items:center;flex-wrap:wrap;background:var(--pn);border:2px solid #0a8f3c;border-radius:10px;padding:6px 10px;z-index:5;max-width:calc(100% - 24px)}
#evBar.on{display:flex}
#evBar .evopt{font-size:12px;display:flex;gap:4px;align-items:center}
#evBar b{color:#0a8f3c;font-size:13px}
#doneBtn{position:absolute;right:12px;top:48px;display:none}
#doneBtn.on{display:block}
#panel{width:350px;flex:0 0 350px;background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--ln)}
#tabs button{flex:1;border:0;background:none;padding:11px 4px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ac)}
#pbody{flex:1;overflow:auto;padding:12px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.note{font-size:13px;color:var(--mut);margin:0 0 10px;line-height:1.35}
h4{margin:14px 0 6px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:17px;font-weight:700}
h4:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pal{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--ln);background:var(--pn2);border-radius:10px;padding:7px;cursor:pointer;text-align:left;min-width:0}
.pal:hover{border-color:var(--ac)}
.pal.on{border-color:var(--ac);box-shadow:0 0 0 2px rgba(232,89,12,.3)}
.pal canvas{width:100%;height:44px;object-fit:contain;display:block;border-radius:6px;background:#fff}
.pal span{font-size:13px;font-weight:600;line-height:1.1}
.pal small{font-size:11px;color:var(--mut);font-weight:400;display:block}
.fld{display:flex;flex-direction:column;gap:3px;margin:0 0 9px;font-size:13px;color:var(--mut)}
.fld textarea{border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:8px 9px;min-height:60px;color:var(--ink);font:inherit;resize:vertical}
.fld input[type=color]{padding:2px;min-height:38px;width:100%}
.fld input[type=checkbox]{min-height:0}
.orow{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px dashed var(--ln);cursor:pointer;font-size:13px}
.orow.on{background:rgba(232,89,12,.12)}
.orow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow small{color:var(--mut)}
.orow .btn{min-height:26px;padding:1px 7px;font-size:12px}
.orow.off span{opacity:.45}
.fld input,.fld select{border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:8px 9px;min-height:38px;color:var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.row2>*,.row3>*{min-width:0}
.fld input,.fld select,.fld textarea{width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.card{border:1px solid var(--ln);background:var(--pn2);border-radius:10px;padding:10px;margin-bottom:10px}
.card b{font-size:14px}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;margin-left:6px;font-weight:600}
.badge.ok{background:rgba(18,128,74,.15);color:var(--gr)}
.badge.warn{background:rgba(232,89,12,.16);color:var(--ac)}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--pn);box-shadow:0 0 0 1px var(--ln);cursor:pointer}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--ln)}
.leg canvas{width:30px;height:24px;flex:0 0 30px;background:#fff;border-radius:3px}
.leg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg i{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.iss{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--ln);cursor:pointer}
.iss b{color:var(--rd)}
input[type=range]{width:100%}

#mapov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#mapov.on{display:flex}
#mapov .mpbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#mapov .mpbar b{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:19px;white-space:nowrap}
#mapov .mpbar input[type=search]{flex:1 1 260px;min-width:160px;border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:8px 10px;min-height:38px;color:var(--ink)}
#mapov select{border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:7px;min-height:38px;color:var(--ink)}
#mpwrap{position:relative;flex:1;min-height:0;background:#0b1620}
#mpmap{position:absolute;inset:0}
#mpframe{position:absolute;pointer-events:none;border:2px solid var(--ac);box-shadow:0 0 0 9999px rgba(8,16,22,.52);z-index:500}
#mpframe::before,#mpframe::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.7)}
#mpframe::before{width:18px;height:1px;margin-left:-9px}#mpframe::after{height:18px;width:1px;margin-top:-9px}
#mpguide{position:absolute;inset:0;overflow:hidden;pointer-events:none}#mpgrid{position:absolute;left:-60%;top:-60%;width:220%;height:220%;background-image:linear-gradient(rgba(255,255,255,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.38) 1px,transparent 1px);background-size:48px 48px;transform-origin:50% 50%}
#mpread{position:absolute;left:0;top:-30px;background:var(--ac);color:var(--ac-ink);font-weight:600;font-size:13px;padding:4px 9px;border-radius:6px 6px 0 0;white-space:nowrap}
#mpres{position:absolute;left:10px;top:58px;z-index:700;background:var(--pn);border:1px solid var(--ln);border-radius:10px;box-shadow:var(--sh);width:min(460px,calc(100% - 20px));display:none;overflow:hidden}
#mpres.on{display:block}
#mpres button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:9px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
#mpres button:hover{background:var(--pn2)}
#mapov .mpfoot{display:flex;gap:12px;align-items:center;padding:8px 10px;background:var(--pn);border-top:1px solid var(--ln);flex-wrap:wrap;font-size:13px}
#mapov .mpfoot label{display:flex;align-items:center;gap:6px;color:var(--mut)}
#mapov .mpnote{color:var(--mut);font-size:12px;flex:1 1 280px}
#mapov .leaflet-container{font-family:inherit;background:#0b1620}
@media(max-width:700px){#mapov .mpfoot label.rg input{width:90px}}
#modal{position:fixed;inset:0;background:rgba(10,20,28,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mbox{background:var(--pn);border-radius:14px;padding:16px;width:min(420px,100%);max-height:90%;overflow:auto;box-shadow:var(--sh)}
.mbox h3{margin:0 0 10px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:21px}
.mbox label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut);margin-bottom:9px}
.mbox input{border:1px solid var(--ln);background:var(--pn2);border-radius:8px;padding:9px;min-height:40px;color:var(--ink)}
.mbox img{max-width:100%;border-radius:8px;border:1px solid var(--ln)}
.mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#welcome{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(233,237,236,.88)}
#welcome.on{display:flex}
#welcome .card{max-width:440px;background:var(--pn);padding:18px;box-shadow:var(--sh)}
#welcome h2{margin:0 0 6px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:26px}
#welcome .btn{display:block;width:100%;margin-top:8px;text-align:left}
#welcome .btn small{display:block;font-weight:400;color:var(--mut);font-size:12px}
#welcome .btn.pri small{color:rgba(255,255,255,.85)}
@media(max-width:820px){
 #main{flex-direction:column}
 #panel{width:100%;flex:0 0 46%;border-left:0;border-top:1px solid var(--ln);display:none}
 #panel.open{display:flex}
 #selbar{bottom:30px}
}
@media(min-width:821px){#bPanel{display:none}}
@media(prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand"><b id="brandName">IMPI RMS</b><span>FloorPlan Studio</span></div>
  <div class="hs"></div>
  <span id="saveChip" hidden></span>
  <button class="btn" id="bPanel">Panel</button>
  <button class="btn pri" id="bExport">Export</button>
 </header>
 <nav id="tools" aria-label="Drawing tools"></nav>
 <div id="main">
  <div id="stage">
   <canvas id="cv"></canvas>
   <div id="hint"></div>
   <button class="btn pri" id="doneBtn">Finish line</button>
   <div id="layBar"><b id="layName"></b><button class="btn sm" data-lb="back">Back to whole plan</button><button class="btn sm pri" data-lb="png">Download PNG</button><button class="btn sm pri" data-lb="pdf">Download PDF</button></div>
   <div id="evBar"><b>Emergency evacuation plan</b><button class="btn sm pri" data-ev="evgen">Generate evacuation routes</button><button class="btn sm" data-ev="evclr">Clear routes</button><button class="btn sm" data-ev="evdraw" title="Draw your own route, or add one the generator missed">Draw a route</button><button class="btn sm" data-ev="evlock" title="Lock all routes so Generate does not replace them">Lock / unlock routes</button><button class="btn sm" data-ev="crowdev">Crowd &amp; capacity</button><label class="evopt"><input type="checkbox" id="evAll"> use every exit</label><label class="evopt"><input type="checkbox" id="evEntr"> entrances count as exits</label><label class="evopt" title="Use the lines of the imported client plan (walls, stands, aisles) as obstacles and run routes along its aisles"><input type="checkbox" id="evPlan"> follow imported plan</label><select id="evDen" aria-label="Route density" class="evopt"><option value="few">Few routes</option><option value="normal">Normal</option><option value="many">Many routes</option></select><button class="btn sm" data-ev="evac">Back to plan</button></div>
   <div id="status"></div>
   <div id="selbar"></div>
   <div id="welcome">
    <div class="card">
     <h2>Start a new plan</h2>
     <p class="note">Layer an aerial image and the client's drawing, calibrate each to a known distance, then redraw everything to scale.</p>
     <button class="btn pri" data-w="map">1. Pick the site on a satellite map<small>Search the address, frame the area; it arrives to true scale, no calibration</small></button>
     <button class="btn" data-w="sat">Upload an aerial image instead<small>Drone shot, Google Earth screenshot or PDF; tap two points a known distance apart</small></button>
     <button class="btn" data-w="plan">2. Import client plan (PDF or image)<small>Overlaid transparently so you can trace it</small></button>
     <button class="btn" data-w="dxf">Import an AutoCAD drawing (DXF)<small>Opens to scale, as an underlay and/or editable lines</small></button>
     <button class="btn" data-w="blank">Start blank<small>Draw on the grid at 1 : 1 metres</small></button>
     <button class="btn" data-w="open">Open a saved project (.json)</button>
    </div>
   </div>
  </div>
  <aside id="panel"><div id="tabs"></div><div id="pbody"></div></aside>
 </div>
</div>
<div id="modal"></div>
<div id="mapov" role="dialog" aria-label="Satellite map"></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden>

<script>window.__FPS_USER=null;window.__FPS_CFG=null;</script>

/* ---------- state ---------- */
var S={view:{x:0,y:0,z:10},layers:[],objs:[],sel:null,tool:'select',arm:null,grid:1,issues:[],tmp:null,tab:'lib',nid:1,nl:1,custom:[],calib:null,mv:null,hover:null,snapPt:null,
 meta:{title:'SITE & FLOOR PLAN',event:'[EVENT NAME]',venue:'[VENUE]',client:'[CLIENT]',date:today(),rev:'A',drawn:'[DRAWN BY]',ref:'FP-'+today().replace(/-/g,'')+'-001',company:'IMPI RMS',paper:'A3',scale:'auto',extent:'content',north:0,minAisle:2,bg:true,logo:null,eventLogo:null,showFront:true,watermark:false,only:null,evac:false,gridMinor:1,gridShow:true,evAll:true,evEntr:true,layouts:[],mode:'outdoor',gridMod:0,gridPrint:true,gridLabels:true,gx:0,gy:0}};
var hist=[],redoS=[];
var R={z:1,u:1};
function px(v){return v*R.u/R.z}

/* ---------- library ---------- */
var LIB=[
 {k:'trestle',n:'Trestle table + 2 benches',w:2.4,h:1.8,c:'Furniture',s:'table',seats:8,lab:''},
 {k:'round10',n:'Round table (10 seat)',w:2.7,h:2.7,c:'Furniture',s:'round',seats:10,lab:''},
 {k:'round8',n:'Round table (8 seat)',w:2.4,h:2.4,c:'Furniture',s:'round',seats:8,lab:''},
 {k:'cocktail',n:'Cocktail table',w:0.8,h:0.8,c:'Furniture',s:'cocktail',lab:''},
 {k:'umbrella',n:'Umbrella (3 m)',w:3,h:3,c:'Furniture',s:'umbrella',lab:''},
 {k:'vip_a',n:'VIP rope enclosure 4 × 4 (velvet)',w:4,h:4,c:'Exhibition',s:'ropebox',rp:'velvet',lab:'VIP'},
 {k:'vip_b',n:'VIP rope enclosure 8 × 5 (velvet)',w:8,h:5,c:'Exhibition',s:'ropebox',rp:'velvet',lab:'VIP'},
 {k:'vip_out',n:'Outdoor VIP rope & pole area 10 × 6',w:10,h:6,c:'Tents',s:'ropebox',rp:'ropepole',lab:'VIP',opn:1},
 {k:'rope_sq',n:'Stanchion & rope enclosure 3 × 3',w:3,h:3,c:'Exhibition',s:'ropebox',rp:'stanchion',lab:''},

/* ---------- geometry ---------- */
function rotv(x,y,a){var c=Math.cos(a),s=Math.sin(a);return {x:x*c-y*s,y:x*s+y*c}}
function dimsOf(o){if(o.t==='sign')return {w:o.s,h:o.s};if(o.t==='door')return {w:o.w,h:o.th||0.6};return {w:o.w,h:o.h}}
function toLocal(o,p){return rotv(p.x-o.x,p.y-o.y,-o.rot*D2R)}
function toWorld(o,lx,ly){var r=rotv(lx,ly,o.rot*D2R);return {x:o.x+r.x,y:o.y+r.y}}
function corners(o){var d=dimsOf(o),w=d.w/2,h=d.h/2;return [[-w,-h],[w,-h],[w,h],[-w,h]].map(function(q){return toWorld(o,q[0],q[1])})}
function w2s(p){return {x:p.x*S.view.z+S.view.x,y:p.y*S.view.z+S.view.y}}
function s2w(p){return {x:(p.x-S.view.x)/S.view.z,y:(p.y-S.view.y)/S.view.z}}
function ptSeg(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy,t=l2?((p.x-a.x)*dx+(p.y-a.y)*dy)/l2:0;t=Math.max(0,Math.min(1,t));var q={x:a.x+t*dx,y:a.y+t*dy};return {d:Math.hypot(p.x-q.x,p.y-q.y),q:q}}
function segInt(a,b,c,d){function o(p,q,r){return (q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x)}var d1=o(a,b,c),d2=o(a,b,d),d3=o(c,d,a),d4=o(c,d,b);return d1*d2<0&&d3*d4<0}
function inPoly(p,P){var ins=false;for(var i=0,j=P.length-1;i<P.length;j=i++){if(((P[i].y>p.y)!==(P[j].y>p.y))&&(p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/(P[j].y-P[i].y)+P[i].x))ins=!ins}return ins}
function polyGap(A,B){
 var i,j;
 for(i=0;i<A.length;i++)for(j=0;j<B.length;j++)if(segInt(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return null;
 if(inPoly(A[0],B)||inPoly(B[0],A))return null;
 var best={d:Infinity},r;
 for(i=0;i<A.length;i++)for(j=0;j<B.length;j++){r=ptSeg(A[i],B[j],B[(j+1)%B.length]);if(r.d<best.d)best={d:r.d,a:A[i],b:r.q}}
 for(i=0;i<B.length;i++)for(j=0;j<A.length;j++){r=ptSeg(B[i],A[j],A[(j+1)%A.length]);if(r.d<best.d)best={d:r.d,a:r.q,b:B[i]}}
 return best;
}
function isCircle(o){var L=LIBM[o.k];return L&&(L.s==='round'||L.s==='cocktail'||L.s==='umbrella')}
function polyOf(o){
 if(isCircle(o)){var r=Math.min(o.w,o.h)/2,p=[];for(var i=0;i<16;i++){var a=i/16*TAU;p.push({x:o.x+Math.cos(a)*r,y:o.y+Math.sin(a)*r})}return p}
 return corners(o);
}

var IDB=null,idbBusy=false,idbAgain=false;
function idbOpen(){return new Promise(function(res,rej){if(IDB)return res(IDB);try{var r=indexedDB.open('fps_local',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){IDB=r.result;res(IDB)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function idbPut(k,v){return idbOpen().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}})})}
function idbGet(k){return idbOpen().then(function(d){return new Promise(function(res,rej){var t=d.transaction('kv','readonly'),q=t.objectStore('kv').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}

async function idbSaveAll(){
 if(idbBusy){idbAgain=true;return}idbBusy=true;
 try{
  var lays=[];
  for(var i=0;i<S.layers.length;i++){var L=S.layers[i];
   if(!L._bk||L._bk.img!==L.img){var sc=Math.min(1,3600/Math.max(L.img.width,L.img.height));L._bk={sc:sc,img:L.img,blob:await layerBlob(L,sc)}}
   var q={mpp:L.mpp/L._bk.sc,blob:L._bk.blob};LAYKEYS.forEach(function(k){if(L[k]!==undefined)q[k]=L[k]});lays.push(q)}
  await idbPut('layers',{at:Date.now(),layers:lays});
  await idbPut('session',{at:Date.now(),dirty:!!S.dirty,meta:S.meta,objs:S.objs,nid:S.nid,custom:S.custom.map(function(c){return {k:c.k,n:c.n,w:c.w,h:c.h,src:c.src}}),cloud:{planId:S.cloud&&S.cloud.planId,rev:S.cloud&&S.cloud.rev}});
  S.idbFail=false

}

 cs.forEach(function(q,j){c.fillStyle=cols[j];c.lineWidth=lw;c.strokeStyle=INK;c.fillRect(q[0]-ps,q[1]-ps,2*ps,2*ps);c.strokeRect(q[0]-ps,q[1]-ps,2*ps,2*ps)});
 c.fillStyle='#8a97a1';c.lineWidth=lw*.8;c.strokeStyle=INK;var st=Math.min(.9,(hx-r)*1.2);
 [[r,-r],[-r,r]].forEach(function(q){var sx=q[0]>0?q[0]+(hx-r)*.1:q[0]-(hx-r)*.1-st;c.fillRect(sx,q[1]-st/2,st,st);c.strokeRect(sx,q[1]-st/2,st,st)})}

  try{var b=setup?{action:'setup',name:v[0],email:v[1],password:v[2]}:{action:'login',email:v[0],password:v[1]};
   var j=await api('/api/auth',{method:'POST',json:b});S.cloud.user=j.user;S.cloud.needsSetup=false;renderPanel();toast('Signed in as '+j.user.name)}
  catch(e){toast(e.message,4500)}
 },setup?'Create':'Sign in');
}
function cloudUser(){
 ask('Add team member',[{l:'Name',v:''},{l:'Email',v:'',type:'email'},{l:'Temporary password (min 10 characters)',v:'',type:'password'}],async function(v){
  try{await api('/api/auth',{method:'POST',json:{action:'createUser',name:v[0],email:v[1],password:v[2]}});toast('Team member added')}catch(e){toast(e.message,4500)}
 },'Add');
}
async function cloudLogout(){try{await api('/api/auth',{method:'POST',json:{action:'logout'}})}catch(e){}S.cloud.user=null;S.cloud.planId=null;S.cloud.rev=null;location.href='/'}
function layerBlob(L,sc){var jq=L.kind==='plan'?.92:.82;return new Promise(function(res){var cn=document.createElement('canvas');cn.width=Math.round(L.img.width*sc);cn.height=Math.round(L.img.height*sc);var c=cn.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cn.width,cn.height);c.drawImage(L.img,0,0,cn.width,cn.height);cn.toBlob(res,'image/jpeg',jq)})}
async function uploadLayer(L){
 var sc=Math.min(1,(L.kind==='plan'?4400:3000)/Math.max(L.img.width,L.img.height)),blob;
 for(var t=0;t<4;t++){blob=await layerBlob(L,sc);if(blob.size<4200000)break;sc*=.75}
 var r=await api('/api/image',{method:'POST',body:blob,headers:{'content-type':'image/jpeg','x-name':encodeURIComponent(L.name)}});
 L.imageId=r.id;L.cloudSc=sc;
}
function cloudSave(){
 ask('Save to cloud',[{l:'Revision label (e.g. A, B, Issued for EMS)',v:S.meta.rev},{l:'Note (optional)',v:''}],async function(v){
  try{
   toast('Saving…',30000);S.meta.rev=v[0]||S.meta.rev;
   for(var i=0;i<S.layers.length;i++)if(!S.layers[i].imageId)await uploadLayer(S.layers[i]);
   var data={v:2,meta:S.meta,objs:S.objs,nid:S.nid,custom:S.custom.map(function(c){return {k:c.k,n:c.n,w:c.w,h:c.h,src:c.src}}),layers:S.layers.map(function(L){return {name:L.name,kind:L.kind,imageId:L.imageId,mpp:L.mpp/(L.cloudSc||1),x:L.x,y:L.y,rot:L.rot,op:L.op,blend:L.blend,cal:L.cal,vis:L.vis,geo:L.geo,base:L.base,_op:L._op,pdfLong:L.pdfLong,crisp:L.crisp}})};
   var j=await api('/api/plans',{method:'POST',json:{planId:S.cloud.planId,label:v[0],note:v[1],data:data}});
   var chk=await api('/api/plans?id='+j.planId+'&rev='+j.rev_no),cd=chk&&chk.revision&&chk.revision.data;
   if(!cd||(cd.objs||[]).length!==S.objs.length||(cd.layers||[]).length!==S.layers.length)throw new Error('The cloud copy did not match what is on screen, so it was not trusted');
   S.cloud.planId=j.planId;S.cloud.rev=j.rev_no;S.dirty=false;S.savedAt=Date.now();S.savedHow='cloud';saveLocal();S.dirty=false;chipUpdate();renderPanel();toast('Saved to the cloud as revision #'+j.rev_no+' and checked',5000);
  }catch(e){toast('Cloud save failed: '+e.message+'. Downloading a backup file instead…',7000);try{await saveProject()}catch(e2){}}
 },'Save');
}
async function applyCloud(res){
 var d=res.revision.data;Object.keys(d.meta||{}).forEach(function(k){S.meta[k]=d.meta[k]});S.logoImg=null;S.objs=d.objs||[];S.nid=d.nid||1;S.custom=[];(d.custom||[]).forEach(addCustomLib);S.layers=[];
 for(var i=0;i<(d.layers||[]).length;i++){var q=d.layers[i],im=await loadImgSrc('/api/image?id='+q.imageId);S.layers.push({id:S.nl++,name:q.name,kind:q.kind,img:im,mpp:q.mpp,x:q.x,y:q.y,rot:q.rot,op:q.op,blend:q.blend,cal:q.cal,vis:q.vis!==false,geo:q.geo,base:q.base,_op:q._op,pdfLong:q.pdfLong,pdfScale:null,crisp:q.crisp,imageId:q.imageId,cloudSc:1})}
 S.sel=null;S.issues=[];hist.length=0;redoS.length=0;S.dismissed=true;S.cloud.planId=res.plan.id;S.cloud.rev=res.revision.rev_no;
 $('#brandName').textContent=S.meta.company||'FloorPlan Studio';fitAll();changed(true);S.dirty=false;S.savedAt=Date.now();S.savedHow='cloud';chipUpdate();
}
async function loadCloud(id,rev){
 try{toast('Opening…',30000);var res=await api('/api/plans?id='+id+(rev?'&rev='+rev:''));await applyCloud(res);toast('Opened revision #'+res.revision.rev_no)}catch(e){toast(e.message,5500)}
}
function listModal(title,rowsHtml,onPick){
 var m=$('#modal');m.innerHTML='<div class="mbox"><h3>'+esc(title)+'</h3>'+rowsHtml+'<div class="mrow"><button class="btn" id="mc">Close</button></div></div>';m.classList.add('on');
 function close(){m.classList.remove('on');m.innerHTML='';m.onclick=null}
 $('#mc').onclick=close;m.onclick=function(e){var r=e.target.closest('[data-pick]');if(r){close();onPick(r.dataset.pick)}};
}
async function cloudOpen(){
 try{var j=await api('/api/plans');
  listModal('Open from cloud',j.plans.length?j.plans.map(function(p){return '<div class="iss" data-pick="'+p.id+'"><span><b style="color:inherit">'+esc(p.event||p.title||'Untitled')+'</b><br><small>'+esc(p.venue||'')+' · rev #'+p.rev_no+' · '+esc(p.by||'')+' · '+new Date(p.updated_at).toLocaleDateString('en-ZA')+'</small></span><b>Open</b></div>'}).join(''):'<p class="note">No saved plans yet.</p>',function(id){loadCloud(id)});
 }catch(e){toast(e.message,4500)}
}
async function cloudRevs(){
 try{var j=await api('/api/plans?id='+S.cloud.planId+'&revs=1');
  listModal('Revision history',j.revs.map(function(r){return '<div class="iss" data-pick="'+r.rev_no+'"><span><b style="color:inherit">#'+r.rev_no+(r.label?' · '+esc(r.label):'')+'</b><br><small>'+esc(r.by||'')+' · '+new Date(r.created_at).toLocaleString('en-ZA')+(r.note?' · '+esc(r.note):'')+'</small></span><b>Open</b></div>'}).join(''),function(n){loadCloud(S.cloud.planId,n)});
 }catch(e){toast(e.message,4500)}
}

/* ---------- venue library: save the bare venue once, start every event from it ---------- */
function venueReady(){if(!S.cloud||!S.cloud.on){toast('Saving venues needs the cloud. Use Save project to keep a file copy for now.',6000);return false}if(!S.cloud.user){toast('Sign in first (Sheet tab, Cloud).',5000);return false}return true}
function cloudSaveVenue(){
 if(!venueReady())return;
 var nv=S.objs.filter(function(o){return o.vn}).length;
 if(!nv){toast('Nothing is marked as venue yet. Trace the venue or turn on Venue mode first.',6000);return}
 ask('Save as venue',[{l:'Venue name (for example CTICC Halls 1-4)',v:(S.meta.venue&&S.meta.venue.indexOf('[')<0)?S.meta.venue:''},{l:'Note (optional)',v:''}],async function(v){
  var name=(v[0]||'').trim();if(!name){toast('Give the venue a name');return}
  try{
   toast('Saving venue…',30000);
   for(var i=0;i<S.layers.length;i++)if(!S.layers[i].imageId)await uploadLayer(S.layers[i]);
   var objs=S.objs.filter(function(o){return o.vn}).map(function(o){var c=JSON.parse(JSON.stringify(o));c.lk=1;return c});
   var meta=Object.assign({},S.meta,{isVenue:1,venue:name,event:'VENUE: '+name,title:name,attend:0,certCap:0,siteArea:0,layouts:[],only:null});
   var data={v:2,meta:meta,objs:objs,nid:S.nid,custom:S.custom.map(function(c){return {k:c.k,n:c.n,w:c.w,h:c.h,src:c.src}}),layers:S.layers.map(function(L){return {name:L.name,kind:L.kind,imageId:L.imageId,mpp:L.mpp/(L.cloudSc||1),x:L.x,y:L.y,rot:L.rot,op:L.op,blend:L.blend,cal:L.cal,vis:L.vis,geo:L.geo,base:L.base,_op:L._op,pdfLong:L.pdfLong,crisp:L.crisp}})};
   var j=await api('/api/plans',{method:'POST',json:{planId:S.meta.venuePlanId||undefined,label:'Venue',note:v[1],data:data}});
   var chk=await api('/api/plans?id='+j.planId+'&rev='+j.rev_no),cd=chk&&chk.revision&&chk.revision.data;
   if(!cd||(cd.objs||[]).length!==objs.length||(cd.layers||[]).length!==S.layers.length)throw new Error('The cloud copy did not match, so it was not trusted');
   S.meta.venuePlanId=j.planId;S.meta.venue=name;saveLocal();renderPanel();
   toast('Venue saved: '+name+' ('+objs.length+' venue objects, locked). Start any event from it with Venue > Start new event from a saved venue.',8000)
  }catch(e){toast('Venue save failed: '+e.message,7000)}
 },'Save venue')}
async function cloudVenuePick(){
 if(!venueReady())return;
 try{var j=await api('/api/plans'),vs=(j.plans||[]).filter(function(p){return /^VENUE:/i.test(p.event||'')});
  if(!vs.length){toast('No saved venues yet. Trace a venue and use Save as venue.',6000);return}
  listModal('Start a new event at which venue?',vs.map(function(p){return '<div class="iss" data-pick="'+p.id+'"><span><b style="color:inherit">'+esc((p.event||'').replace(/^VENUE:\\s*/i,''))+'</b><br><small>rev #'+p.rev_no+' · '+esc(p.by||'')+' · '+new Date(p.updated_at).toLocaleDateString('en-ZA')+'</small></span><b>Use</b></div>'}).join(''),async function(id){
   try{toast('Opening venue…',30000);var res=await api('/api/plans?id='+id);var vid=res.plan.id;await applyCloud(res);S.meta.venuePlanId=vid;
    S.objs.forEach(function(o){o.vn=1});venueNewEvent();delete S.meta.isVenue;S.meta.venuePlanId=vid;saveLocal();renderPanel();
    toast('New event started on this venue. Add the event layout now; it saves as a new plan.',7000)}catch(e){toast(e.message,6000)}})
 }catch(e){toast(e.message,5000)}}

loadLocal();enforceBrand();buildTools();cloudInit();idbRestore();
$('#brandName').textContent=S.meta.company||'FloorPlan Studio';
setTool('select');renderPanel();
if(S.objs.length)S.dismissed=true;
updateWelcome();
setTimeout(function(){resize();fitAll()},30);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){draw()});
if(!matchMedia('(max-width:820px)').matches){}
})();
